name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Setup application
        run: composer setup

      - name: Run CI checks
        run: composer ci:check

      - name: Upload frontend build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  deploy:
    name: Deploy to web1
    needs: ci
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: web1
    permissions:
      contents: read
    env:
      DEPLOY_PROFILE: ${{ vars.AUTH_MANAGER_PROFILE }}
      DEPLOY_SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Validate deployment profile and route
        run: |
          test "$DEPLOY_PROFILE" = 'bherila'
          test -n "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL#https://}" != "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL%/}" = "$DEPLOY_SITE_URL"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: public/build/

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@182ba6cf1834f75173b454ff01cfad0732ba9c2a # v1.1.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: auth-manager
          site-url: ${{ env.DEPLOY_SITE_URL }}
          env-source: .config/auth-manager/deployment.env
          env-assert: AUTH_MANAGER_PROFILE=${{ env.DEPLOY_PROFILE }}
          excludes: |
            .db-credentials
            /public/branding/
          run-migrations: true
          migration-order: before-upload
          passport-key-directory: storage/app/private/oauth
          branding-source: ${{ vars.BRANDING_SOURCE }}

  deploy_resource:
    name: Deploy resource profile to web1
    needs: ci
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: resource-web1
    permissions:
      contents: read
    env:
      DEPLOY_PROFILE: ${{ vars.AUTH_MANAGER_PROFILE }}
      DEPLOY_SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Validate deployment profile and route
        run: |
          test "$DEPLOY_PROFILE" = 'resource'
          test -n "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL#https://}" != "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL%/}" = "$DEPLOY_SITE_URL"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: public/build/

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@182ba6cf1834f75173b454ff01cfad0732ba9c2a # v1.1.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: auth-manager
          site-url: ${{ env.DEPLOY_SITE_URL }}
          env-source: .config/auth-manager/deployment.env
          env-assert: AUTH_MANAGER_PROFILE=${{ env.DEPLOY_PROFILE }}
          excludes: |
            .db-credentials
            /public/branding/
          run-migrations: true
          migration-order: before-upload
          passport-key-directory: storage/app/private/oauth
          branding-source: ${{ vars.BRANDING_SOURCE }}
