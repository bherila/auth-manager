name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.11.2 --activate

      - name: Setup application
        run: composer setup

      - name: Run CI checks
        run: composer ci:check

      - name: Test deployment hooks
        run: bash tests/deployment/test-deploy-hooks.sh

      - name: Upload frontend build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  mariadb:
    name: MariaDB engine tests
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    # The `mariadb` PHPUnit group asserts engine behaviour SQLite cannot model (identifier
    # sequences, implicit DDL commits). phpunit.xml excludes it; phpunit.mariadb.xml forces this
    # throwaway database name, so the run cannot be pointed at anything else.
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: auth_manager_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Run the MariaDB group
        run: php -d memory_limit=1G vendor/bin/phpunit -c phpunit.mariadb.xml

  release_artifact:
    name: Reproducible release artifact
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.11.2 --activate

      # The release workflow publishes this exact build. Building it twice proves the
      # checksum depends only on the commit.
      - name: Build the release artifact twice and compare
        run: |
          set -euo pipefail
          bash scripts/release/build-artifact.sh v0.0.0-ci "$RUNNER_TEMP/first"
          bash scripts/release/build-artifact.sh v0.0.0-ci "$RUNNER_TEMP/second"
          cmp "$RUNNER_TEMP/first/SHA256SUMS" "$RUNNER_TEMP/second/SHA256SUMS"
          {
            echo '### Release artifact'
            echo
            echo "SHA-256 \`$(cut -d' ' -f1 "$RUNNER_TEMP/first/SHA256SUMS")\` for commit \`$(git rev-parse HEAD)\`"
          } >>"$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to web1
    needs: [ci, mariadb]
    # Deploys only from a push to main of the canonical repository, after CI and the MariaDB engine tests passed.
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'bherila/auth-manager' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.mariadb.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: web1
    concurrency:
      group: auth-manager-production-web1
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_PROFILE: ${{ vars.AUTH_MANAGER_PROFILE }}
      DEPLOY_SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Validate deployment profile and route
        run: |
          test "$DEPLOY_PROFILE" = 'bherila'
          test -n "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL#https://}" != "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL%/}" = "$DEPLOY_SITE_URL"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: public/build/

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@57aacf3e6f7c1972e1fd0f09eb459c85635900e7 # v2.4.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: auth-manager
          site-url: ${{ env.DEPLOY_SITE_URL }}
          env-source: .config/auth-manager/deployment.env
          env-assert: AUTH_MANAGER_PROFILE=${{ env.DEPLOY_PROFILE }}
          excludes: |
            .db-credentials
            /public/branding/
          run-migrations: true
          # Atomic releases migrate the candidate, validate it, then select it. Storage (with the
          # Passport key pair) is shared by every release; .env, database credentials and branding are
          # installed into each candidate from private files under the account home.
          deployment-mode: atomic
          atomic-layout: stable-directory
          persistent-paths: storage
          retain-releases: '3'
          # An identity provider stays in maintenance after a risky failure until the owner decides.
          failure-policy: maintenance
          # Exact revision currently live in this environment; required for the first conversion only.
          initial-live-commit: ${{ vars.ATOMIC_INITIAL_LIVE_COMMIT }}
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          artisan-memory-limit: 1G
          operational-audit: 'true'
          runtime-audit: 'true'
          pre-migrate-script: scripts/deploy/pre-migrate.sh
          quiesce-script: scripts/deploy/quiesce.sh
          passport-key-directory: storage/app/private/oauth
          branding-source: ${{ vars.BRANDING_SOURCE }}

  deploy_resource:
    name: Deploy resource profile to web1
    needs: [ci, mariadb]
    # Deploys only from a push to main of the canonical repository, after CI and the MariaDB engine tests passed.
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'bherila/auth-manager' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.mariadb.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: resource-web1
    concurrency:
      group: auth-manager-production-resource-web1
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_PROFILE: ${{ vars.AUTH_MANAGER_PROFILE }}
      DEPLOY_SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - name: Validate deployment profile and route
        run: |
          test "$DEPLOY_PROFILE" = 'resource'
          test -n "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL#https://}" != "$DEPLOY_SITE_URL"
          test "${DEPLOY_SITE_URL%/}" = "$DEPLOY_SITE_URL"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: public/build/

      - name: Deploy with the shared cPanel action
        uses: bherila/shared-cpanel-deployment@57aacf3e6f7c1972e1fd0f09eb459c85635900e7 # v2.4.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: auth-manager
          site-url: ${{ env.DEPLOY_SITE_URL }}
          env-source: .config/auth-manager/deployment.env
          env-assert: AUTH_MANAGER_PROFILE=${{ env.DEPLOY_PROFILE }}
          excludes: |
            .db-credentials
            /public/branding/
          run-migrations: true
          # Atomic releases migrate the candidate, validate it, then select it. Storage (with the
          # Passport key pair) is shared by every release; .env, database credentials and branding are
          # installed into each candidate from private files under the account home.
          deployment-mode: atomic
          atomic-layout: stable-directory
          persistent-paths: storage
          retain-releases: '3'
          # An identity provider stays in maintenance after a risky failure until the owner decides.
          failure-policy: maintenance
          # Exact revision currently live in this environment; required for the first conversion only.
          initial-live-commit: ${{ vars.ATOMIC_INITIAL_LIVE_COMMIT }}
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          artisan-memory-limit: 1G
          operational-audit: 'true'
          runtime-audit: 'true'
          pre-migrate-script: scripts/deploy/pre-migrate.sh
          quiesce-script: scripts/deploy/quiesce.sh
          passport-key-directory: storage/app/private/oauth
          branding-source: ${{ vars.BRANDING_SOURCE }}
